{% extends "base.html" %}{% block content %}<h1>Exam Management</h1><div class="card"><form method="post"><input name="title" placeholder="Exam Title" required><input name="subject" placeholder="Subject"><input name="duration" type="number" placeholder="Duration"><input name="questions" type="number" placeholder="Questions"><button class="btn">Create Exam</button></form></div><br><table><tr><th>Exam</th><th>Subject</th><th>Duration</th><th>Questions</th></tr>{% for e in exams %}<tr><td>{{e.title}}</td><td>{{e.subject}}</td><td>{{e.duration}}</td><td>{{e.questions}}</td></tr>{% endfor %}</table>{% endblock %}
