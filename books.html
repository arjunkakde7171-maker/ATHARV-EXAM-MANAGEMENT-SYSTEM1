{% extends "base.html" %}{% block content %}<h1>Books</h1><div class="card"><form method="post"><input name="title" placeholder="Book Title" required><input name="author" placeholder="Author"><input name="price" placeholder="Price"><button class="btn">Add Book</button></form></div><div class="grid">{% for b in books %}<div class="card"><h3>{{b.title}}</h3><p>{{b.author}}</p><b>₹ {{b.price}}</b></div>{% endfor %}</div>{% endblock %}
